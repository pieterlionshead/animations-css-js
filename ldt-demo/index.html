<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LDT Demo | Loading Dots Transition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="scene">
      <section class="panel">
        <p class="eyebrow">ldt-demo</p>
        <h1>Loading Dots Transition</h1>
        <p class="lede">
          A compact environment that showcases a playful looping animation using
          three dots. Click restart to replay the sequence.
        </p>

        <div class="loader" aria-label="Loading animation" role="status">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <button id="restart">Restart animation</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
